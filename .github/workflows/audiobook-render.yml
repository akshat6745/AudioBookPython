name: Render audiobooks on Modal

# Edit render_request.json on this branch and commit with "run": true. GitHub starts a detached Modal L40S
# render, then watches until the server is healthy and one chapter has rendered.
# Needs MODAL_TOKEN_ID and MODAL_TOKEN_SECRET.
on:
  push:
    branches: [audiobook-gpu-render]
    paths: [render_request.json]

permissions:
  contents: read

concurrency:
  group: audiobook-render
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check request
        id: req
        run: python -c "import json; print('run=' + str(json.load(open('render_request.json')).get('run') is True).lower())" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.req.outputs.run == 'true'
        with:
          python-version: "3.11"
      - if: steps.req.outputs.run == 'true'
        run: python -m pip install modal
      - name: Start detached render
        if: steps.req.outputs.run == 'true'
        run: python scripts/gpu_tts/audiobook/queue_modal_task.py render_request.json
      - name: Verify actual chapter rendering
        if: steps.req.outputs.run == 'true'
        run: python scripts/gpu_tts/audiobook/monitor_modal_render.py
