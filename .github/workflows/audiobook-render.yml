name: Render audiobooks on Beam

# Edit render_request.json on this branch in the GitHub web editor and commit with "run": true. This deploys
# beam_app.py and queues one render task on a Beam RTX 4090; the task keeps running after this workflow ends.
# Needs the repository secret BEAM_TOKEN.
on:
  push:
    branches: [audiobook-gpu-render]
    paths: [render_request.json]

permissions:
  contents: read

concurrency:
  group: audiobook-render
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    env:
      BEAM_TOKEN: ${{ secrets.BEAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check request
        id: req
        run: python -c "import json; print('run=' + str(json.load(open('render_request.json')).get('run') is True).lower())" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.req.outputs.run == 'true'
        with:
          python-version: "3.11"
      - if: steps.req.outputs.run == 'true'
        run: python -m pip install beam-client
      - name: Deploy
        if: steps.req.outputs.run == 'true'
        run: beam --no-input deploy beam_app.py:render_novels --name audiobook-render --json | tee deploy.json
      - name: Queue render task
        if: steps.req.outputs.run == 'true'
        run: python scripts/gpu_tts/audiobook/queue_beam_task.py deploy.json render_request.json
