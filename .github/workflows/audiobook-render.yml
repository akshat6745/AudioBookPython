name: Render audiobooks on Beam

# Actions -> "Render audiobooks on Beam" -> Run workflow. Deploys beam_app.py and queues one render task on a
# Beam RTX 4090; the task keeps running after this workflow ends. Needs the repository secret BEAM_TOKEN.
on:
  workflow_dispatch:
    inputs:
      novels:
        description: "Novel slugs separated by spaces (empty = all emotion-tagged novels)"
        required: false
        default: ""
      chapters:
        description: "Chapter filter, e.g. 1-3 (empty = all)"
        required: false
        default: ""
      retry_held:
        description: "Also re-render chapters held for review"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: audiobook-render
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    env:
      BEAM_TOKEN: ${{ secrets.BEAM_TOKEN }}
      NOVELS: ${{ inputs.novels }}
      CHAPTERS: ${{ inputs.chapters }}
      RETRY_HELD: ${{ inputs.retry_held }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install beam-client
      - name: Deploy
        run: beam --no-input deploy beam_app.py:render_novels --name audiobook-render --json | tee deploy.json
      - name: Queue render task
        run: python scripts/gpu_tts/audiobook/queue_beam_task.py deploy.json
