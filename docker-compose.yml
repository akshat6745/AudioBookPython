services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SHEET_ID=${SHEET_ID}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./:/app:ro
    restart: unless-stopped
    healthcheck:
      # Was checking port 8000 while the container actually serves on 8080
      # (see Dockerfile's ENV PORT=8080 / CMD) — healthcheck could never
      # have passed.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
